# GUI 与命令行共用的默认配置。首次完成环境设置后即可运行下面的日常列表。
Accounts: []
Extra:
  dnpath: ''
  adb_path: adb
  adb_serial: ''
StoryEvent:
  source_urls: []
  discover_sources: true
  allow_local_trials: true
  use_local_teams: false
  first_clear: false
  bosses: false
  stories: true
  memoirs: true
  missions: true
  exchange: true
  max_boss_attempts: 10
  battle_timeout: 220
  timeout: 1800
RevivalEvent:
  account_key: default
  source_urls: []
  discover_sources: true
  allow_local_trials: true
  use_local_teams: false
  timeout: 2400
  battle_timeout: 220
Gift:
  auto_dismantle: true
  free_slots: 750
  max_gift_batches: 30
  timeout: 900
Caravan:
  timeout: 1800
  max_rolls: 200
Task:
  1:
    - [free_gacha, false]
    - [schedule]
    - [arena]
    - [princess_arena]
    - [research]
    - [adventure_daily]
    - [get_quest_reward]
    - [revival_event_once]
    - [campaign_clean, true, false]
    - [quick_clean, 2]
    - [luna_tower_clean]
    - [shop_buy, {1: [-1], 9: [-1]}]
    - [get_quest_reward]
    - [get_gift, true]

# 按需运行 dungeon_first_clear，不加入默认日常列表
Dungeon:
  prepare_only: false
  area: 四彩的灵峰
  source_urls: []
  discover_sources: true
  use_local_teams: false
  timeout: 3600
  battle_timeout: 220
  max_battles: 30
  allow_local_trials: true
  preflight: true
  audit_only: false
  auto_equip: false
  review_on_unexpected: true

# 按需运行 upgrade_all_characters，不加入默认日常
CharacterUpgrade:
  timeout: 1800
  max_batches: 40

# 按需提升角色好感度并阅读解锁的角色剧情；消耗现有礼物，不加入每日。
CharacterBond:
  timeout: 21600
  max_characters: 400
  max_pages: 80
  max_story_steps_per_character: 200
  max_gifts_per_character: 2000

# 按需深域推进；本地试打须明确启用，不自动加入每日。
Abyss:
  prepare_only: false
  allow_local_trials: false
  source_urls: []
  audit_only: false
  elements: [fire, water, wind, light, dark]
  max_failures_per_stage: 6
  max_repeat_failures_per_stage: 2
  allow_five_star_upgrade: false
  allow_divine_amulets: false
  max_battles: 30
  timeout: 3600
  battle_timeout: 220
  discover_sources: true
  sources:
    max_videos: 4
    max_age_hours: 24
    request_timeout: 12
    cache_dir: cache/game/strategies/sources
    browser_session: true
    browser_channel: msedge
