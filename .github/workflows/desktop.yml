name: Windows GUI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'pcrscript/desktop.py'
      - 'test/verify_desktop_runtime.ps1'
      - 'test/verify_desktop_bootstrap.ps1'
    tags: ['gui-v*']
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      gui: ${{ steps.detect.outputs.gui }}
    steps:
      - name: Check whether this PR changes GUI files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('gui', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const isGuiFile = path => path?.startsWith('desktop/') ||
              path === 'pcrscript/desktop.py' ||
              path === 'test/verify_desktop_runtime.ps1' ||
              path === 'test/verify_desktop_bootstrap.ps1';
            core.setOutput('gui', String(files.some(file =>
              isGuiFile(file.filename) || isGuiFile(file.previous_filename))));

  build:
    needs: scope
    if: needs.scope.outputs.gui == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline Python regression tests
        run: python -X utf8 -m unittest discover -s test -p 'test_*.py'
      - name: Build lightweight .NET Framework GUI
        run: dotnet build desktop/PcrDesktop/PcrDesktop.csproj -c Release -o artifacts/gui -p:DebugType=None -p:DebugSymbols=false
      - name: Runtime-only download and headless GUI verification
        shell: pwsh
        run: ./test/verify_desktop_runtime.ps1
      - name: Check portable package size
        shell: pwsh
        run: |
          $size = (Get-ChildItem artifacts/gui -File -Recurse | Measure-Object Length -Sum).Sum
          if ($size -gt 5MB) { throw "GUI files exceed 5 MB; check for bundled runtime: $size" }
      - name: Fresh tool and dependency installation
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: ./test/verify_desktop_bootstrap.ps1
      - name: Package binary and usage notes
        shell: pwsh
        run: |
          @'
          PCR GUI 使用说明

          完整解压后运行 PcrDesktop.exe，保留旁边的 DLL 和 .exe.config 文件。
          首次引导选择项目位置和设备，点击“一键准备运行环境”，再检查设备连接。
          无需提前安装 Git、Python 或手动创建虚拟环境；首次下载需要联网。
          雷电填写包含 ldconsole.exe 的安装目录并设置 960×540；手机模式留空雷电目录。
          手机可在界面阅读许可后下载 ADB 工具，还需开启 USB 调试并在手机上授权电脑。
          登录游戏首页、核对日常任务及消费选项后运行；手机布局尚需验证。

          图文指南：https://github.com/Gibberer/pcr-script/blob/master/docs/guides/desktop.md
          任务指南：https://github.com/Gibberer/pcr-script/blob/master/docs/guides/tasks.md
          新版下载：https://github.com/Gibberer/pcr-script/releases
          '@ | Set-Content artifacts/gui/使用说明.txt -Encoding utf8
          Compress-Archive -Path artifacts/gui/* -DestinationPath artifacts/PcrDesktop-win-x64.zip
          (Get-FileHash artifacts/PcrDesktop-win-x64.zip -Algorithm SHA256).Hash + '  PcrDesktop-win-x64.zip' | Set-Content artifacts/SHA256SUMS.txt
      - name: Upload GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: PcrDesktop-win-x64
          path: |
            artifacts/PcrDesktop-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload GUI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUI-smoke-evidence
          path: artifacts/gui-smoke.png*
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gui-v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: gui-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a merged commit
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw 'GUI releases must point to a commit already merged into master.' }
      - uses: actions/download-artifact@v4
        with:
          name: PcrDesktop-win-x64
          path: artifacts/release
      - name: Publish verified GUI package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = 'artifacts/release/PcrDesktop-win-x64.zip'
          $checksum = 'artifacts/release/SHA256SUMS.txt'
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne $expected) { throw 'Package checksum mismatch.' }
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists. Published assets are not overwritten; use a new version tag.'
          }
          gh release create $env:RELEASE_TAG $package $checksum --verify-tag --generate-notes --title "PCR GUI $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
