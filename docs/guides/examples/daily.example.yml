# 用于清日常的配置文件
Accounts: #多账号相关：存账号信息
  -
    account: '账号1'
    password: '密码'
  # -
  #   account: '账号2'
  #   password: '密码'
Extra:
  dnpath: '' #雷电模拟器路径，例如：F:\leidian\LDPlayer9
  adb_path: adb #雷电模拟器路径留空时使用；可填 platform-tools/adb.exe 的绝对路径
  adb_serial: '' #留空且未设 dnpath 时使用唯一 ADB 设备；多个设备时填写 adb devices 中的序列号
StoryEvent:
  source_urls: [] # 本活动优先攻略链接；未填写时自动搜索
  discover_sources: true
  allow_local_trials: true # 解析缺培养时按账号状态有限试打，记录假设与尝试
  use_local_teams: false # 旧 YAML 方案的过渡兼容；默认不依赖本地作业
  first_clear: false # 首日验证待办，日常不执行首通
  bosses: false # 未通关首领留待活动首日实测
  stories: true
  memoirs: true
  missions: true # 每天检查每日、普通、特别、称号四栏奖励
  exchange: true # 每天用游戏一键交换消耗全部活动券
  max_boss_attempts: 10
  battle_timeout: 220
  timeout: 1800
RevivalEvent:
  account_key: default # 同一账号保持不变；切换账号时使用不同值
  source_urls: [] # 本复刻活动优先攻略链接
  discover_sources: true
  allow_local_trials: true
  use_local_teams: false
  timeout: 2400
  battle_timeout: 220
Gift:
  auto_dismantle: true # 满仓时使用游戏已有的自动分解设置，不改筛选规则
  free_slots: 750 # 目标空位，允许 500～1000
  max_gift_batches: 30 # 一批最多收取 100 件礼物
  timeout: 900
Caravan: # 按需任务配置；存在此配置不代表加入每日任务列表
  timeout: 1800
  max_rolls: 200
DawnLabyrinth: # 首通后可添加 [dawn_labyrinth] 日常项；仅跳过已通关难度
  timeout: 600
  max_passes: 99 # 本次最多消费通行证，范围 1～99；不会超过进入时持有量
DawnLabyrinthFirstClear: # 按需运行 [dawn_labyrinth_first_clear]，每次至多出发一次
  timeout: 1800
  max_battles: 30
  retry_failed_boss: false
Recollection:
  claim_rewards: true
  sweep_dominion: true
  max_sweeps: 9 # 所有已通关霸领域合计；会消费首通可用的本周次数
  preview_only: false
  timeout: 600
  areas: [霸瞳皇帝的领域, 泽恩的领域, 米洛克的领域]
RecollectionFirstClear: # 按需运行 recollection_first_clear，不加入普通日常
  areas: [记忆领域, 霸瞳皇帝的领域, 泽恩的领域, 米洛克的领域]
  max_battles: 30
  max_attempts_per_stage: 2
  timeout: 3600
  battle_timeout: 220
  discover_sources: true
  allow_local_trials: false
  auto_equip: false
  source_urls: []
  sources: {}
TeamBattle:
  timeout: 1800
  battle_timeout: 220
  max_real_attacks: 3
  max_simulations: 12
AbyssSubjugation:
  first_clear: true # 关闭时只执行已经满足条件的扫荡
  discover_sources: true
  source_urls: []
  max_stamina: 400
  max_boss_tickets: 99
  max_normal_trials: 6
  max_simulations: 30
  max_source_batches: 3
  auto_equip_special: true
  allow_five_star_upgrade: false
  allow_divine_amulets: false
  timeout: 7200
  battle_timeout: 240
  allow_local_trials: true
  auto_collect_house_stamina: true
  preview_only: false
# 需要首页的任务由调度器自动返回首页，无需穿插 tohomepage。
Task: #配置执行任务,配置任务名称，如果需要传入参数在下面增加参数，可以根据不同的账号序号配置任务。
  1: # 多账号相关，可以针对账号配置不同的任务，如果是单账号日常不需要关注。
    -
      - free_gacha #抽取免费十连（只在免费10连期间有效）
      - False #是否抽取所有免费十连，如果有多天未进行登录会有多次免费十连
    -
      - schedule #完成日程表的内容
    -
      - arena #打一把竞技场
    -
      - princess_arena #打一把公主竞技场
    -
      - research #圣迹和神殿调查
    -
      - adventure_daily
    -
      - recollection # 普通报酬及已通关霸扫荡；先推进首通可保留本周霸次数
    -
      - get_quest_reward #领取任务奖励（获取赠送的体力）
    -
      - revival_event_once # 复刻情报筛选；每期完成后自动跳过
    -
      - campaign_clean  # 新版活动重复日：困难扫荡、剧情、任务、兑换（首通暂不执行）
      - True # 是否扫荡活动困难关卡
      - False # 是否将剩余体力花费在活动普通章节上
    -
      - abyss_subjugation # 时限任务先于清体力；全部首领各难度首通后扫荡极难
    -
      - quick_clean # 时限任务之后，用快捷扫荡清理剩余体力
      - 2 #使用预设2，这里需要注意当只有困难关卡双倍掉落时会强行切换为使用预设3。所以建议把该预设设置为通常关卡，预设3设置为困难关卡。
    -
      - team_battle # 团队战开放期间，体力扫荡后使用已取得的挑战次数
    -
      - luna_tower_clean # 进行露娜塔的回廊扫荡，通过露娜塔后开放（只在露娜塔开放期间执行）
    -
      - shop_buy #商店购买
      -
        1: # 通常商店
          - -1 # 全部分类中可购买的商品
        9: # 限定商店
          - -1 # 全部分类中可购买的商品
    -
      - get_quest_reward  # 领取每日、普通、称号任务奖励
    -
      - get_gift # 领取礼物
      - True # 忽略体力收取

# 按需运行 dungeon_first_clear，不加入默认日常列表
Dungeon:
  area: 四彩的灵峰
  source_urls: [] # 本地下城优先使用的攻略链接
  discover_sources: true
  use_local_teams: false # 旧 YAML 方案的过渡兼容
  timeout: 3600
  battle_timeout: 220
  max_battles: 30
  allow_local_trials: false # 需明确授权才按账号现状试打
  preflight: true
  audit_only: false
  auto_equip: false
  review_on_unexpected: true

# 按需运行 upgrade_all_characters，不加入默认日常
CharacterUpgrade:
  timeout: 1800
  max_batches: 40

# 按需运行 max_character_bonds；消耗现有礼物，不自动加入日常。
CharacterBond:
  timeout: 21600
  max_characters: 400
  max_pages: 80
  max_story_steps_per_character: 200
  max_gifts_per_character: 2000

# 按需启用，本地试验不自动加入上述日常。
Abyss:
  allow_local_trials: false
  source_urls: [] # 本深域任务优先使用的攻略链接
  audit_only: false
  elements: [fire, water, wind, light, dark]
  max_failures_per_stage: 6
  max_repeat_failures_per_stage: 2
  allow_five_star_upgrade: false
  allow_divine_amulets: false
  max_battles: 30
  timeout: 3600
  battle_timeout: 220
  discover_sources: true
